services:
  uptime-kuma:
    image: louislam/uptime-kuma:1

    container_name: uptime-kuma

    restart: always

    ports:
      - "3001:3001"

    volumes:
      - uptime-kuma-data:/app/data

    environment:
      - TZ=Asia/Jakarta

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  uptime-kuma-data:
